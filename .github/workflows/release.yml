# Pushing a tag like v0.3.0 builds the Windows installer and the macOS disk images (Apple silicon and Intel) and opens
# a draft release with them. Review the draft on GitHub and publish it: the app's update check only sees published
# releases. The Mac app is not signed: the first time, open it with right-click, Open.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
            rust_targets: ""
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_targets: "aarch64-apple-darwin"
          - os: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_targets: "x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Docky ${{ github.ref_name }}
          releaseBody: "Windows: baixe o `Docky_..._x64-setup.exe` e rode por cima da versão instalada (suas configurações ficam). Mac: baixe o `.dmg` (aarch64 para Apple silicon, x64 para Intel), arraste o Docky para Aplicativos e, na primeira vez, abra com o botão direito, Abrir."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
