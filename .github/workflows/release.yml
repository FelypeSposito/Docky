# Pushing a tag like v0.3.0 builds the Windows installer and opens a draft release with it.
# Review the draft on GitHub and publish it: the app's update check only sees published releases.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Docky ${{ github.ref_name }}
          releaseBody: "Baixe o `Docky_..._x64-setup.exe` abaixo e rode por cima da versão instalada: suas configurações ficam."
          releaseDraft: true
          prerelease: false
