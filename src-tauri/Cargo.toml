[package]
name = "docky"
version = "0.7.0"
description = "Docky — uma ilha dinâmica para o Windows e o macOS"
authors = ["Felype Sposito"]
license = "MIT"
repository = "https://github.com/FelypeSposito/Docky"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "docky_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: a transparent window on macOS (the island is drawn on a clear window).
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
getrandom = "0.3"
base64 = "0.22"
ureq = "3"
sha2 = "0.10"
# Each target takes its own store: Windows' Credential Manager, the macOS Keychain.
keyring = { version = "3", features = ["windows-native", "apple-native"] }
time = { version = "0.3", features = ["parsing", "formatting", "macros", "local-offset"] }
sysinfo = "0.37"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# The island over the menu bar (its window level), the pasteboard and the mouse buttons: AppKit, as Tauri uses it.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSWindow", "NSEvent", "NSResponder", "NSGraphics", "NSScreen"] }

[target.'cfg(windows)'.dependencies]
# The `implement` macro of `windows` expands to paths in `windows_core`, so it has to be a direct dependency.
windows-core = "0.61"
windows-numerics = "0.2"
windows = { version = "0.61", features = [
  "Foundation",
  "Foundation_Numerics",
  "Graphics",
  "System",
  "UI",
  "UI_Composition",
  "UI_Composition_Desktop",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Composition",
  "Win32_System_WinRT_Graphics_Direct2D",
  "Devices_Bluetooth",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Properties",
  "Win32_Media_Audio",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Globalization",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Power",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
  "Media",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
